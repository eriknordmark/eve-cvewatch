name: Scanner regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.2
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ci/requirements-test.txt
      - run: python -m unittest discover -s ci/tests -v
      - run: |
          for script in ci/*.sh ci/eve/*.sh ci/alpine/*.sh; do
            bash -n "$script"
          done
